[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessrl"
version = "0.1.0"
description = "AlphaZero-style self-play chess agent: policy/value ResNet, batched MCTS, no human game data"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "python-chess>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chessrl = "chessrl.cli:main"

[tool.setuptools.packages.find]
include = ["chessrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
